<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px -apple-system, system-ui, sans-serif; width: 280px; padding: 14px; }
    h3   { margin: 0; }
    .sub { color: #888; margin: 2px 0 10px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    label.cb { font-weight: 400; font-size: 12px; color: #555; margin: 8px 0; }
    label.cb input { margin-right: 6px; vertical-align: middle; }
    input[type="text"], input[type="password"] {
      width: 100%; box-sizing: border-box; padding: 6px 8px;
      border: 1px solid #ccc; border-radius: 5px;
    }
    button { padding: 6px 16px; border: 0; border-radius: 5px;
             color: #fff; cursor: pointer; font: inherit; }
    button.primary { background: #10a37f; margin-top: 12px; }
    button.walk    { background: #3b82f6; margin-top: 8px; width: 100%; }
    hr { border: 0; border-top: 1px solid #eee; margin: 14px 0; }
    #status { margin-top: 8px; min-height: 16px; color: #10a37f; font-size: 12px; }
  </style>
</head>
<body>
  <h3>Refinery Lite</h3>
  <div class="sub">ChatGPT conversations → dopo.st</div>

  <label for="dopoUrl">dopo.st URL</label>
  <input id="dopoUrl" type="text" placeholder="https://dopo.st" />

  <label for="token">Token</label>
  <input id="token" type="password" placeholder="dopo owner token" />

  <button id="save" class="primary">Save</button>

  <hr />

  <label class="cb"><input id="onlyUnsynced" type="checkbox" checked />Only unsynced chats</label>
  <button id="walk" class="walk">Sync all chats</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
